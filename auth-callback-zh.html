<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在登录… — MOVA CRAFT</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..500&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400..600&family=Noto+Sans+SC:wght@400..600&display=swap" rel="stylesheet">

<!--
  AUTH CALLBACK — 登录回跳页：
    1. OAuth 服务商重定向（Apple / Google）
    2. 模拟模式 OAuth（?mock=apple|google）

  邮箱 OTP 已不再走这一页——验证码在 login-zh.html 上直接验证。
  ?mock=email 路径仅作向后兼容保留。

  TODO BACKEND: 真实环境下 Supabase SDK 会通过 URL hash（#access_token=...&refresh_token=...）
  自动设置 session，前端只需等设置完成后跳转到 Mova CraftAuth.consumeRedirectTarget()。
-->

<style>
:root {
  --cream: #F5F1E8;
  --cream-light: #FBF8F1;
  --charcoal: #1F2937;
  --charcoal-soft: #374151;
  --ink: #111827;
  --brass: #B8956A;
  --brass-deep: #8E6F47;
  --brass-light: #D4B896;
  --line: rgba(31, 41, 55, 0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Manrope', 'Noto Sans SC', system-ui, sans-serif;
  background: var(--cream);
  color: var(--charcoal);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}

.callback-card {
  text-align: center;
  max-width: 420px;
  padding: 40px 32px;
}

.seal {
  width: 88px;
  height: 88px;
  margin: 0 auto 28px;
  border: 1.5px solid var(--brass);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: var(--brass-deep);
}
.seal::after {
  content: '';
  position: absolute;
  inset: -10px;
  border: 1px solid var(--line);
  border-radius: 50%;
  animation: pulse 2s ease-out infinite;
}
@keyframes pulse {
  0% { opacity: 0.6; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.18); }
}
.seal svg { width: 38px; height: 38px; }

.eyebrow {
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--brass-deep);
  margin-bottom: 14px;
  display: block;
}

h1 {
  font-family: 'Fraunces', 'Noto Serif SC', serif;
  font-variation-settings: 'opsz' 144;
  font-size: 30px;
  font-weight: 400;
  font-style: italic;
  color: var(--ink);
  margin-bottom: 12px;
}

p {
  font-size: 14px;
  color: var(--charcoal-soft);
  line-height: 1.7;
}

.error-state h1 { font-style: normal; }
.error-state .seal { color: var(--charcoal); border-color: var(--charcoal-soft); }
.error-state .seal::after { animation: none; }

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 28px;
  background: var(--charcoal);
  color: var(--cream);
  border: 1.5px solid var(--charcoal);
  font-family: 'Manrope', 'Noto Sans SC', sans-serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  cursor: pointer;
  text-decoration: none;
  margin-top: 28px;
}
.btn-primary:hover { background: var(--cream); color: var(--charcoal); }
</style>
</head>
<body>

<div class="callback-card" id="loading-state">
  <div class="seal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 12l2 2 4-4M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
    </svg>
  </div>
  <span class="eyebrow">§ 正在登录</span>
  <h1>欢迎回来。</h1>
  <p>稍等片刻——我们正在验证链接并准备好你的账户。</p>
</div>

<div class="callback-card error-state" id="error-state" style="display: none;">
  <div class="seal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6v6M12 16.5h.01"/>
      <circle cx="12" cy="12" r="9"/>
    </svg>
  </div>
  <span class="eyebrow">§ 登录失败</span>
  <h1 id="error-title">链接无效。</h1>
  <p id="error-body">此链接可能已过期或已被使用，请回到登录页重新申请一次。</p>
  <a href="login-zh.html" class="btn-primary">
    返回登录
    <span style="font-family: monospace;">→</span>
  </a>
</div>

<script src="auth-state.js"></script>
<script>
(function () {
  function getQuery(name) {
    const m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  function showError(title, body) {
    document.getElementById('loading-state').style.display = 'none';
    const err = document.getElementById('error-state');
    err.style.display = 'block';
    if (title) document.getElementById('error-title').textContent = title;
    if (body) document.getElementById('error-body').textContent = body;
  }

  // ============================================================
  // MOCK MODE — 处理 ?mock=apple|google|email[&email=...]
  //
  // TODO BACKEND: 真实流程下 Supabase SDK 会在页面加载时
  // 自动解析 URL hash（#access_token=...）并设置 session。
  // 伪代码：
  //   supabase.auth.onAuthStateChange((event, session) => {
  //     if (event === 'SIGNED_IN') redirectAfter();
  //   });
  // ============================================================
  const mockProvider = getQuery('mock');
  const errorParam = getQuery('error');

  if (errorParam) {
    if (errorParam === 'expired') {
      showError('验证码已过期。', '验证码仅 10 分钟内有效，请重新申请一次。');
    } else if (errorParam === 'oauth_failed') {
      showError('登录未成功。', '登录过程中遇到问题，请重试一次，或改用邮箱验证码方式。');
    } else {
      showError(); // 默认文案
    }
    return;
  }

  if (mockProvider) {
    const emailFromQuery = getQuery('email');
    try {
      Mova CraftAuth._mockCompleteSignIn(mockProvider, emailFromQuery);
      // 短暂延迟让用户看到欢迎卡片
      setTimeout(() => {
        const target = Mova CraftAuth.consumeRedirectTarget('account-zh.html');
        window.location.replace(target);
      }, 900);
    } catch (e) {
      showError();
    }
    return;
  }

  // 真实流程占位：等 Supabase SDK 解析完 hash 后 getUser 会返回值，轮询一会儿。
  let tries = 0;
  const interval = setInterval(() => {
    if (Mova CraftAuth.getUser()) {
      clearInterval(interval);
      const target = Mova CraftAuth.consumeRedirectTarget('account-zh.html');
      window.location.replace(target);
    } else if (tries++ > 20) {
      clearInterval(interval);
      showError();
    }
  }, 200);
})();
</script>

</body>
</html>
