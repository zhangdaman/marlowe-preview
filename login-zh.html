<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — MOVA CRAFT</title>
<meta name="description" content="登录你的 Mova Craft 账户 — 邮箱 6 位验证码或 Google。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..500&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400..600&family=Noto+Sans+SC:wght@400..600&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #F5F1E8;
  --cream-light: #FBF8F1;
  --paper: #EDE8DA;
  --charcoal: #1F2937;
  --charcoal-soft: #374151;
  --ink: #111827;
  --brass: #B8956A;
  --brass-deep: #8E6F47;
  --brass-light: #D4B896;
  --rust: #8B2E2E;
  --line: rgba(31, 41, 55, 0.12);
  --line-soft: rgba(31, 41, 55, 0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Manrope', 'Noto Sans SC', system-ui, sans-serif;
  background: var(--cream);
  color: var(--charcoal);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}
.container { max-width: 1240px; margin: 0 auto; padding: 0 32px; width: 100%; }
@media (max-width: 768px) { .container { padding: 0 20px; } }

.eyebrow {
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--brass-deep);
}

/* Nav (minimal) ====================================================== */
nav.main-nav {
  background: var(--cream);
  border-bottom: 1px solid var(--line-soft);
  padding: 22px 0;
}
.nav-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 40px;
}
.logo {
  font-family: 'Fraunces', serif;
  font-variation-settings: 'opsz' 144;
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0.18em;
  color: var(--ink);
  text-decoration: none;
  text-align: center;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--charcoal-soft);
  text-decoration: none;
}
.back-link:hover { color: var(--charcoal); }

/* Page layout ======================================================== */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 0 80px;
}
.auth-card {
  max-width: 460px;
  width: 100%;
  background: var(--cream-light);
  border: 1px solid var(--line);
  padding: 56px 44px;
}
@media (max-width: 600px) { .auth-card { padding: 40px 28px; } }

.auth-header { margin-bottom: 36px; text-align: center; }
.auth-header .eyebrow { display: inline-block; margin-bottom: 14px; }
.auth-header h1 {
  font-family: 'Fraunces', 'Noto Serif SC', serif;
  font-variation-settings: 'opsz' 144;
  font-size: 32px;
  line-height: 1.2;
  letter-spacing: -0.01em;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 12px;
}
.auth-header h1 em { font-style: italic; color: var(--brass-deep); }
.auth-header p {
  font-size: 14px;
  color: var(--charcoal-soft);
  line-height: 1.7;
}

/* OAuth buttons ====================================================== */
.oauth-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 24px;
}
.oauth-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 16px;
  background: var(--cream);
  border: 1.5px solid var(--charcoal);
  font-family: 'Manrope', 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--charcoal);
  cursor: pointer;
  transition: all 200ms;
}
.oauth-btn:hover { background: var(--charcoal); color: var(--cream); }
.oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.oauth-btn.apple svg { fill: currentColor; }

.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 24px 0;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--charcoal-soft);
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* Email + OTP form =================================================== */
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.field label {
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--brass-deep);
}
.field input {
  font-family: 'Manrope', 'Noto Sans SC', sans-serif;
  font-size: 15px;
  padding: 14px 16px;
  background: var(--cream);
  border: 1px solid var(--line);
  color: var(--charcoal);
  outline: none;
  transition: border-color 200ms;
}
.field input:focus { border-color: var(--brass-deep); }
.field input::placeholder { color: var(--charcoal-soft); opacity: 0.45; }

/* OTP input */
.otp-input {
  font-family: 'JetBrains Mono', monospace !important;
  font-size: 24px !important;
  text-align: center;
  letter-spacing: 0.5em;
  padding: 18px 16px 18px 24px !important;
}

/* Remember-me row */
.remember-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding: 4px 2px;
  cursor: pointer;
  user-select: none;
}
.remember-row input[type="checkbox"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--charcoal);
}
.remember-row label {
  font-size: 13px;
  color: var(--charcoal-soft);
  cursor: pointer;
  line-height: 1.5;
}
.remember-row .sub {
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--brass-deep);
  display: block;
  margin-top: 2px;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 20px;
  background: var(--charcoal);
  color: var(--cream);
  border: 1.5px solid var(--charcoal);
  font-family: 'Manrope', 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 250ms;
}
.btn-primary:hover { background: var(--cream); color: var(--charcoal); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
.btn-arrow { transition: transform 200ms; }
.btn-primary:hover .btn-arrow { transform: translateX(4px); }

.helper-text {
  font-size: 12px;
  color: var(--charcoal-soft);
  margin-top: 14px;
  line-height: 1.7;
  text-align: center;
}
.helper-text a {
  color: var(--brass-deep);
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* Code-entry state =================================================== */
.code-state { display: none; text-align: center; }
.code-state.active { display: block; }
.code-mark {
  width: 80px;
  height: 80px;
  margin: 0 auto 24px;
  border: 1.5px solid var(--brass);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: var(--brass-deep);
}
.code-mark::after {
  content: '';
  position: absolute;
  inset: -8px;
  border: 1px solid var(--line);
  border-radius: 50%;
}
.code-mark svg { width: 36px; height: 36px; }
.code-state h2 {
  font-family: 'Fraunces', 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 500;
  font-style: italic;
  color: var(--ink);
  margin-bottom: 12px;
}
.code-state .code-lede {
  font-size: 14px;
  color: var(--charcoal-soft);
  line-height: 1.7;
  margin-bottom: 8px;
}
.code-state .code-lede strong { color: var(--charcoal); font-weight: 500; }
.code-state .code-sub {
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--charcoal-soft);
  margin-bottom: 24px;
}

.error-banner {
  background: rgba(139, 46, 46, 0.06);
  border: 1px solid rgba(139, 46, 46, 0.25);
  color: var(--rust);
  font-size: 13px;
  padding: 10px 14px;
  margin-bottom: 14px;
  text-align: left;
  line-height: 1.6;
  display: none;
}
.error-banner.active { display: block; }

/* 占位：开发期把生成的验证码展示在页面上，方便复制（后端接入后删掉） */
.mock-hint {
  margin-top: 14px;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--charcoal-soft);
  text-align: center;
  padding: 10px 12px;
  background: var(--paper);
  border: 1px dashed var(--line);
}
.mock-hint strong { color: var(--charcoal); }
.mock-hint .label { color: var(--brass-deep); margin-right: 8px; }

.code-actions { margin-top: 18px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.btn-text {
  background: none;
  border: none;
  font-family: 'Manrope', 'Noto Sans SC', sans-serif;
  font-size: 13px;
  color: var(--charcoal-soft);
  text-decoration: underline;
  text-underline-offset: 4px;
  cursor: pointer;
  padding: 4px 8px;
}
.btn-text:hover { color: var(--charcoal); }
.btn-text:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

/* Footer mini ======================================================== */
.footer-mini {
  text-align: center;
  font-size: 12px;
  color: rgba(31, 41, 55, 0.55);
  padding: 32px 0;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  letter-spacing: 0.05em;
}
.footer-mini a {
  color: var(--charcoal-soft);
  text-decoration: underline;
  text-underline-offset: 3px;
  margin: 0 8px;
}
.footer-mini a:hover { color: var(--charcoal); }
.footer-mini .lang-note {
  display: block;
  margin-top: 8px;
  font-size: 10px;
  color: rgba(31, 41, 55, 0.4);
}
</style>
</head>
<body>

<nav class="main-nav">
  <div class="container nav-grid">
    <a href="index-zh.html" class="back-link">
      <span style="font-family: monospace;">←</span>
      返回首页
    </a>
    <a href="index-zh.html" class="logo">MOVA CRAFT</a>
    <span></span>
  </div>
</nav>

<main>
  <div class="container" style="display: flex; justify-content: center;">
    <div class="auth-card">

      <!-- 步骤 1：邮箱 + OAuth -->
      <div id="email-state">
        <header class="auth-header">
          <div class="eyebrow">§ 登录</div>
          <h1>欢迎来到 <em>Mova Craft。</em></h1>
          <p>一个账户管理下单、设计稿存档与回购。免密码登录。</p>
        </header>

        <div class="oauth-stack">
          <!-- v1 仅上 Google；Apple 登录推迟到 v1.5，届时解开下面注释并在 Supabase 配置 Apple Developer 凭据即可。
               auth-state.js 的 signInWithProvider() 已支持 'apple' 入参。
          <button class="oauth-btn apple" onclick="onOAuth('apple')">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.09-.52-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            使用 Apple 继续
          </button>
          -->
          <button class="oauth-btn" onclick="onOAuth('google')">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            使用 Google 继续
          </button>
        </div>

        <div class="divider">或使用邮箱</div>

        <div class="error-banner" id="email-error"></div>

        <form id="email-form" onsubmit="onSendCode(event)">
          <div class="field">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" autofocus>
          </div>

          <label class="remember-row" for="remember-me">
            <input type="checkbox" id="remember-me" checked>
            <span>
              在这台设备上保持登录
              <span class="sub">7 天有效 · 公用电脑请取消</span>
            </span>
          </label>

          <button type="submit" class="btn-primary" id="send-code-btn">
            发送 6 位验证码
            <span class="btn-arrow">→</span>
          </button>
        </form>

        <p class="helper-text">
          继续即代表同意 <a href="terms.html">服务条款</a> 与 <a href="privacy.html">隐私政策</a>。
        </p>
      </div>

      <!-- 步骤 2：输入验证码 -->
      <div id="code-state" class="code-state">
        <div class="code-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7l8 6 8-6M5 19h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z"/>
          </svg>
        </div>
        <h2>请查收邮箱。</h2>
        <p class="code-lede">6 位验证码已发送到 <strong id="sent-email">你</strong>。</p>
        <p class="code-sub">10 分钟内有效</p>

        <div class="error-banner" id="code-error"></div>

        <form id="code-form" onsubmit="onVerifyCode(event)">
          <div class="field">
            <label for="code-input" style="text-align: center;">验证码</label>
            <input
              type="text"
              id="code-input"
              class="otp-input"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              pattern="[0-9]{6}"
              placeholder="••••••"
              required
              autofocus>
          </div>
          <button type="submit" class="btn-primary" id="verify-btn">
            验证
            <span class="btn-arrow">→</span>
          </button>
        </form>

        <!-- 仅占位：开发期把验证码展示在页面，便于复制 -->
        <div class="mock-hint" id="mock-hint" style="display: none;">
          <span class="label">[占位]</span>验证码：<strong id="mock-code-display">——————</strong>
        </div>

        <div class="code-actions">
          <button class="btn-text" id="resend-btn" type="button" onclick="onResend()">没收到？重新发送</button>
          <button class="btn-text" type="button" onclick="resetForm()">使用其他邮箱</button>
        </div>
      </div>

    </div>
  </div>
</main>

<div class="footer-mini">
  <a href="privacy.html">隐私政策</a>
  ·
  <a href="terms.html">服务条款</a>
  ·
  <a href="contact.html">联系</a>
  <span class="lang-note">以上为英文页面</span>
</div>

<script src="auth-state.js"></script>
<script>
let pendingEmail = null;
let pendingRemember = true;
let resendCooldown = 0;

function showError(elId, message) {
  const el = document.getElementById(elId);
  el.textContent = message;
  el.classList.add('active');
}
function clearError(elId) {
  const el = document.getElementById(elId);
  el.textContent = '';
  el.classList.remove('active');
}

// 步骤 1：发送验证码
async function onSendCode(e) {
  e.preventDefault();
  clearError('email-error');

  const email = document.getElementById('email').value.trim();
  const remember = document.getElementById('remember-me').checked;
  const btn = document.getElementById('send-code-btn');
  btn.disabled = true;

  const result = await Mova CraftAuth.signInWithEmailOtp(email);

  if (result.error) {
    btn.disabled = false;
    showError('email-error', '邮箱格式不对，请检查后重试。');
    return;
  }

  pendingEmail = email;
  pendingRemember = remember;
  document.getElementById('sent-email').textContent = email;

  // 占位：把 mock 验证码显示在页面（后端接入后移除）
  if (result.mockCode) {
    document.getElementById('mock-code-display').textContent = result.mockCode;
    document.getElementById('mock-hint').style.display = 'block';
  }

  document.getElementById('email-state').style.display = 'none';
  document.getElementById('code-state').classList.add('active');
  document.getElementById('code-input').value = '';
  document.getElementById('code-input').focus();

  startResendCooldown(30);
}

// 步骤 2：验证 6 位码
async function onVerifyCode(e) {
  e.preventDefault();
  clearError('code-error');

  const code = document.getElementById('code-input').value.replace(/\s/g, '');
  const btn = document.getElementById('verify-btn');
  btn.disabled = true;

  const result = await Mova CraftAuth.verifyEmailOtp(pendingEmail, code, pendingRemember);

  if (result.error) {
    btn.disabled = false;
    const msg = ({
      invalid_code: '验证码不对，请检查后重试。',
      expired: '验证码已过期，请重新发送。',
      no_pending: '当前没有待验证的验证码，请重新申请。',
    })[result.error] || '出错了，请重试。';
    showError('code-error', msg);
    return;
  }

  const target = Mova CraftAuth.consumeRedirectTarget('account-zh.html');
  window.location.replace(target);
}

async function onResend() {
  if (!pendingEmail || resendCooldown > 0) return;
  const result = await Mova CraftAuth.resendEmailOtp(pendingEmail);
  if (result.mockCode) {
    document.getElementById('mock-code-display').textContent = result.mockCode;
  }
  clearError('code-error');
  document.getElementById('code-input').value = '';
  document.getElementById('code-input').focus();
  startResendCooldown(30);
}

function startResendCooldown(seconds) {
  resendCooldown = seconds;
  const btn = document.getElementById('resend-btn');
  btn.disabled = true;
  btn.textContent = `${seconds} 秒后可重发`;
  const interval = setInterval(() => {
    resendCooldown--;
    if (resendCooldown <= 0) {
      clearInterval(interval);
      btn.disabled = false;
      btn.textContent = '没收到？重新发送';
    } else {
      btn.textContent = `${resendCooldown} 秒后可重发`;
    }
  }, 1000);
}

function resetForm() {
  clearError('email-error');
  clearError('code-error');
  document.getElementById('code-state').classList.remove('active');
  document.getElementById('email-state').style.display = 'block';
  document.getElementById('send-code-btn').disabled = false;
  document.getElementById('verify-btn').disabled = false;
  document.getElementById('email').value = '';
  document.getElementById('email').focus();
  document.getElementById('mock-hint').style.display = 'none';
  pendingEmail = null;
}

function onOAuth(provider) {
  const remember = document.getElementById('remember-me').checked;
  Mova CraftAuth.signInWithProvider(provider, remember);
}

// 已登录？直接跳走
if (Mova CraftAuth.getUser()) {
  const target = Mova CraftAuth.consumeRedirectTarget('account-zh.html');
  window.location.replace(target);
}
</script>

</body>
</html>
