<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的账户 — MARLOWE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..500&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400..600&family=Noto+Sans+SC:wght@400..600&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #F5F1E8;
  --cream-light: #FBF8F1;
  --paper: #EDE8DA;
  --charcoal: #1F2937;
  --charcoal-soft: #374151;
  --ink: #111827;
  --brass: #B8956A;
  --brass-deep: #8E6F47;
  --brass-light: #D4B896;
  --line: rgba(31, 41, 55, 0.12);
  --line-soft: rgba(31, 41, 55, 0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Manrope', 'Noto Sans SC', system-ui, sans-serif;
  background: var(--cream);
  color: var(--charcoal);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}
.container { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
@media (max-width: 768px) { .container { padding: 0 20px; } }

.eyebrow {
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--brass-deep);
}

/* Nav ============================================================== */
nav.main-nav {
  background: rgba(245, 241, 232, 0.95);
  border-bottom: 1px solid var(--line-soft);
  padding: 22px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.nav-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 40px;
}
.logo {
  font-family: 'Fraunces', serif;
  font-variation-settings: 'opsz' 144;
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0.18em;
  color: var(--ink);
  text-decoration: none;
  text-align: center;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--charcoal-soft);
  text-decoration: none;
}
.back-link:hover { color: var(--charcoal); }
.nav-cta {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 16px;
}
.nav-cta a {
  font-size: 13px;
  color: var(--charcoal-soft);
  text-decoration: none;
}
.nav-cta a:hover { color: var(--brass-deep); }
.signout-btn {
  background: none;
  border: 1px solid var(--line);
  padding: 8px 14px;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--charcoal-soft);
  cursor: pointer;
  transition: all 200ms;
}
.signout-btn:hover {
  border-color: var(--charcoal);
  color: var(--charcoal);
}

/* Page layout ===================================================== */
.account-page { padding: 60px 0 120px; }

.account-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 56px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 32px;
  flex-wrap: wrap;
  gap: 24px;
}
.account-header-text .eyebrow { display: inline-block; margin-bottom: 12px; }
.account-header-text h1 {
  font-family: 'Fraunces', 'Noto Serif SC', serif;
  font-variation-settings: 'opsz' 144;
  font-size: clamp(36px, 5vw, 52px);
  line-height: 1.2;
  letter-spacing: -0.01em;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 8px;
}
.account-header-text h1 em { font-style: italic; color: var(--brass-deep); }
.account-meta {
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--charcoal-soft);
  text-align: right;
  line-height: 1.8;
}
.account-meta strong { color: var(--charcoal); font-weight: 500; }
@media (max-width: 600px) {
  .account-meta { text-align: left; }
}

/* Section ========================================================= */
.section {
  margin-bottom: 64px;
}
.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 12px;
}
.section-header h2 {
  font-family: 'Fraunces', 'Noto Serif SC', serif;
  font-size: 26px;
  font-weight: 500;
  color: var(--ink);
}
.section-header .section-num {
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--brass-deep);
}

/* Empty state ==================================================== */
.empty-card {
  background: var(--cream-light);
  border: 1px solid var(--line);
  padding: 48px 32px;
  text-align: center;
}
.empty-card h3 {
  font-family: 'Fraunces', 'Noto Serif SC', serif;
  font-size: 22px;
  font-style: italic;
  color: var(--ink);
  margin-bottom: 8px;
}
.empty-card p {
  font-size: 14px;
  color: var(--charcoal-soft);
  margin-bottom: 24px;
  line-height: 1.7;
}
.empty-card .btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 24px;
  background: var(--charcoal);
  color: var(--cream);
  border: 1.5px solid var(--charcoal);
  font-family: 'Manrope', 'Noto Sans SC', sans-serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-decoration: none;
  transition: all 200ms;
}
.empty-card .btn-primary:hover { background: var(--cream); color: var(--charcoal); }

/* Order item ===================================================== */
.order-item {
  background: var(--cream-light);
  border: 1px solid var(--line);
  padding: 24px 28px;
  margin-bottom: 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
}
.order-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--charcoal-soft);
  margin-bottom: 8px;
}
.order-meta strong { color: var(--brass-deep); margin-right: 6px; font-weight: 400; }
.order-title {
  font-family: 'Fraunces', 'Noto Serif SC', serif;
  font-size: 20px;
  color: var(--ink);
  margin-bottom: 4px;
}
.order-status {
  display: inline-block;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  padding: 4px 10px;
  border: 1px solid var(--brass);
  color: var(--brass-deep);
  margin-top: 6px;
}
.order-status.delivered { border-color: var(--charcoal-soft); color: var(--charcoal-soft); }
.order-status.shipped { border-color: var(--brass-deep); color: var(--brass-deep); }
.order-status.in_production { border-color: var(--brass); color: var(--brass-deep); }

/* 物流子块（订单有 shipping 信息时渲染）============================== */
.order-shipping {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 24px;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--charcoal-soft);
}
.order-shipping .label { color: var(--brass-deep); margin-right: 6px; }
.order-shipping .tracking-link {
  color: var(--charcoal);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.order-shipping .tracking-link:hover { color: var(--brass-deep); }
.order-shipping .ship-pending {
  grid-column: 1 / -1;
  font-style: italic;
  color: var(--charcoal-soft);
}
@media (max-width: 600px) {
  .order-shipping { grid-template-columns: 1fr; }
}
.order-action {
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--charcoal);
  text-decoration: underline;
  text-underline-offset: 4px;
}
.order-action:hover { color: var(--brass-deep); }
@media (max-width: 600px) {
  .order-item { grid-template-columns: 1fr; }
}

/* Design grid（历史生成）========================================== */
.design-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.design-card {
  background: var(--cream-light);
  border: 1px solid var(--line);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms;
}
.design-card:hover {
  transform: translateY(-3px);
  border-color: var(--charcoal);
  box-shadow: 0 16px 36px -16px rgba(31, 41, 55, 0.18);
}
.design-thumb {
  width: 100%;
  aspect-ratio: 5 / 6;
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.design-thumb svg { width: 100%; height: 100%; display: block; }
.design-meta {
  font-size: 13px;
  color: var(--charcoal-soft);
  line-height: 1.6;
}
.design-meta strong { color: var(--ink); display: block; font-family: 'Fraunces', 'Noto Serif SC', serif; font-size: 16px; font-weight: 500; margin-bottom: 4px; }
.design-meta-line {
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--charcoal-soft);
  margin-top: 4px;
}
.design-cta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 12px;
  margin-top: auto;
  border-top: 1px solid var(--line);
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--charcoal);
}
.design-cta-row .arrow {
  font-family: monospace;
  color: var(--brass-deep);
  transition: transform 200ms;
}
.design-card:hover .design-cta-row .arrow { transform: translateX(4px); }

/* Footer ========================================================== */
.footer-mini {
  text-align: center;
  font-size: 12px;
  color: rgba(31, 41, 55, 0.55);
  padding: 32px 0;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  letter-spacing: 0.05em;
  border-top: 1px solid var(--line);
}
.footer-mini a {
  color: var(--charcoal-soft);
  text-decoration: underline;
  text-underline-offset: 3px;
  margin: 0 8px;
}
.footer-mini a:hover { color: var(--charcoal); }
.footer-mini .lang-note {
  display: block;
  margin-top: 6px;
  font-size: 10px;
  color: rgba(31, 41, 55, 0.4);
}
</style>
</head>
<body>

<nav class="main-nav">
  <div class="container nav-grid">
    <a href="index-zh.html" class="back-link">
      <span style="font-family: monospace;">←</span>
      返回首页
    </a>
    <a href="index-zh.html" class="logo">MARLOWE</a>
    <div class="nav-cta">
      <a href="designer-zh.html">打开设计器</a>
      <button class="signout-btn" onclick="onSignOut()">退出登录</button>
    </div>
  </div>
</nav>

<main class="account-page">
  <div class="container">

    <header class="account-header">
      <div class="account-header-text">
        <div class="eyebrow">§ 我的账户</div>
        <h1>欢迎回来，<em id="display-name">朋友。</em></h1>
      </div>
      <div class="account-meta">
        <div><strong>邮箱</strong> <span id="user-email">—</span></div>
        <div><strong>登录方式</strong> <span id="user-provider">—</span></div>
        <div><strong>注册于</strong> <span id="user-since">—</span></div>
      </div>
    </header>

    <!-- Orders -->
    <section class="section">
      <div class="section-header">
        <h2>订单</h2>
        <span class="section-num">§ 01</span>
      </div>
      <div id="orders-container">
        <!-- 由 JS 注入 -->
      </div>
    </section>

    <!-- 历史生成 -->
    <section class="section">
      <div class="section-header">
        <h2>历史生成</h2>
        <span class="section-num">§ 02 · 点击任一卡片重新定制</span>
      </div>
      <div id="designs-container">
        <!-- 由 JS 注入 -->
      </div>
    </section>

  </div>
</main>

<div class="footer-mini">
  <a href="privacy.html">隐私政策</a>
  ·
  <a href="terms.html">服务条款</a>
  ·
  <a href="contact.html">联系</a>
  <span class="lang-note">以上为英文页面</span>
</div>

<script src="auth-state.js"></script>
<script src="chat-widget.js" defer></script>
<script>
// 需要登录 — 未登录就跳到登录页
MarloweAuth.requireAuth().then(initAccountPage).catch(() => {});

function initAccountPage(user) {
  // Header
  const handle = (user.displayName || user.email.split('@')[0]) + '。';
  document.getElementById('display-name').textContent = handle;
  document.getElementById('user-email').textContent = user.email;
  const providerLabel = {
    email_otp: '邮箱验证码',
    magic_link: '邮箱验证码',
    apple: 'Apple',
    google: 'Google',
  }[user.provider] || user.provider;
  document.getElementById('user-provider').textContent = providerLabel;
  if (user.signedInAt) {
    const d = new Date(user.signedInAt);
    document.getElementById('user-since').textContent = d.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  // 占位数据 — TODO BACKEND: 替换为 /api/me/orders + /api/me/designs
  const mockData = readMockData(user);
  renderOrders(mockData.orders);
  renderDesigns(mockData.designs);
}

// MOCK: 读取 checkout-zh.html 写入的 marlowe_last_order
// 真实流程：GET /api/me/orders + GET /api/me/designs
function readMockData(user) {
  let orders = [];
  let designs = [];
  try {
    const last = JSON.parse(localStorage.getItem('marlowe_last_order') || 'null');
    if (last) {
      // 根据下单时长 mock 不同状态，方便预览 4 种 UI 状态。
      // 真实流程下后端会直接给出 status + shipping。
      const ageMs = Date.now() - new Date(last.placedAt).getTime();
      const ageDays = ageMs / (24 * 60 * 60 * 1000);
      let status = 'in_production';
      let shipping = null;
      if (ageDays >= 16)      status = 'delivered';
      else if (ageDays >= 10) status = 'shipped';
      else                    status = 'in_production';

      if (status === 'shipped' || status === 'delivered') {
        const shippedAt = new Date(new Date(last.placedAt).getTime() + 10 * 24 * 60 * 60 * 1000).toISOString();
        const etaStart  = new Date(new Date(last.placedAt).getTime() + 13 * 24 * 60 * 60 * 1000).toISOString();
        const etaEnd    = new Date(new Date(last.placedAt).getTime() + 16 * 24 * 60 * 60 * 1000).toISOString();
        shipping = {
          carrier: 'DHL Express',
          tracking_number: '9400 1118 9956 ' + last.orderId.replace(/[^A-Z0-9]/g, '').slice(0, 10),
          tracking_url: 'https://www.dhl.com/global-en/home/tracking.html',
          shipped_at: shippedAt,
          eta_date_start: etaStart,
          eta_date_end: etaEnd,
        };
      }

      orders.push({
        id: last.orderId,
        placed_at: last.placedAt,
        status: status,
        total_cents: (last.payload && last.payload.subtotal || 109) * 100,
        items: (last.payload && last.payload.items) || [],
        shipping: shipping,
      });
      // 把每个商品转成一条「保存的设计」
      ((last.payload && last.payload.items) || []).forEach((item, i) => {
        if (item.productType && item.productType !== 'tag') return; // 项圈不进设计存档
        designs.push({
          id: 'design-' + last.orderId + '-' + i,
          shape: item.shape,
          color: item.color,
          pet_name: item.petName,
          pet_phone: item.petPhone,
          tag_id: item.tagId,
          created_at: last.placedAt,
        });
      });
    }
  } catch (e) {}
  return { orders, designs };
}

function fmtPrice(cents) { return '$' + (cents / 100).toFixed(2); }
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', year: 'numeric' });
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderOrders(orders) {
  const container = document.getElementById('orders-container');
  if (!orders.length) {
    container.innerHTML = `
      <div class="empty-card">
        <h3>还没有订单。</h3>
        <p>从一枚独一无二的肖像牌开始——上传照片，挑形状与表面处理，剩下交给我们雕刻。</p>
        <a href="designer-zh.html" class="btn-primary">
          打开设计器
          <span style="font-family: monospace;">→</span>
        </a>
      </div>
    `;
    return;
  }

  container.innerHTML = orders.map(order => {
    const itemCount = (order.items || []).reduce((n, it) => n + (it.quantity || 1), 0);
    const itemSummary = itemCount + ' 件商品';
    return `
      <article class="order-item">
        <div>
          <div class="order-meta">
            <span><strong>订单号</strong>${escapeHTML(order.id)}</span>
            <span><strong>下单</strong>${fmtDate(order.placed_at)}</span>
            <span><strong>合计</strong>${fmtPrice(order.total_cents)}</span>
          </div>
          <h3 class="order-title">${itemSummary}</h3>
          <span class="order-status ${escapeHTML(order.status)}">${escapeHTML(formatStatus(order.status))}</span>
          ${renderShipping(order)}
        </div>
        <a href="thank-you-zh.html?order=${encodeURIComponent(order.id)}" class="order-action">查看详情 →</a>
      </article>
    `;
  }).join('');
}

// 物流子块 — 订单含 shipping 字段时渲染
// TODO BACKEND: order.shipping 来自 /api/me/orders 响应。结构同 EN 版本：
//   shipping: { carrier, tracking_number, tracking_url, shipped_at,
//               eta_date_start, eta_date_end, last_event? }
function renderShipping(order) {
  const s = order.shipping;
  if (!s) {
    if (order.status === 'in_production' || order.status === 'received') {
      return `<div class="order-shipping"><span class="ship-pending">物流单号会在发货后出现在这里。</span></div>`;
    }
    return '';
  }
  const trackUrl = s.tracking_url || '#';
  const etaText = (s.eta_date_start && s.eta_date_end)
    ? fmtShortDate(s.eta_date_start) + ' – ' + fmtShortDate(s.eta_date_end)
    : (s.eta_date_start ? fmtShortDate(s.eta_date_start) : '—');
  return `
    <div class="order-shipping">
      <span><span class="label">承运</span>${escapeHTML(s.carrier || '—')}</span>
      <span><span class="label">预计送达</span>${etaText}</span>
      <span style="grid-column: 1 / -1;">
        <span class="label">单号</span>
        <a class="tracking-link" href="${escapeHTML(trackUrl)}" target="_blank" rel="noopener">${escapeHTML(s.tracking_number || '—')} →</a>
      </span>
    </div>
  `;
}

function fmtShortDate(iso) {
  return new Date(iso).toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
}

function formatStatus(status) {
  return ({
    received: '已收到',
    in_production: '生产中',
    shipped: '已发货',
    delivered: '已送达',
    cancelled: '已取消',
  })[status] || status;
}

const SHAPE_NAMES = { shield: '盾形牌', octagon: '八角牌', disc: '圆牌' };
const COLOR_NAMES = {
  silver: '钛本色', charcoal: '枪黑色',
  brass: '香槟金', teal: '钛蓝', copper: '玫瑰铜',
};

function renderDesigns(designs) {
  const container = document.getElementById('designs-container');
  if (!designs.length) {
    container.innerHTML = `
      <div class="empty-card">
        <h3>还没有生成记录。</h3>
        <p>每次生成的肖像都会保存在这里，回来点一下就能改个表面、换段刻字、或加配项圈——不必重新上传照片。</p>
      </div>
    `;
    return;
  }

  container.innerHTML = '<div class="design-grid">' + designs.map(d => `
    <a class="design-card" href="designer-zh.html?design=${encodeURIComponent(d.id)}">
      <div class="design-thumb">${miniSVG(d)}</div>
      <div class="design-meta">
        <strong>${escapeHTML(SHAPE_NAMES[d.shape] || d.shape)}</strong>
        ${escapeHTML(COLOR_NAMES[d.color] || d.color)}<br>
        ${escapeHTML(d.pet_name)} · ${escapeHTML(d.pet_phone)}
        <div class="design-meta-line">§ #${escapeHTML(d.tag_id || d.id.slice(-8))} · 保存于 ${fmtDate(d.created_at)}</div>
      </div>
      <div class="design-cta-row">
        <span>再次定制</span>
        <span class="arrow">→</span>
      </div>
    </a>
  `).join('') + '</div>';
}

// 设计稿缩略图占位（真实流程会用 halftone_url 或重建的 SVG）
function miniSVG(d) {
  const colors = {
    silver: ['#F2F4F6', '#3A3F46'],
    brass: ['#E8D4AB', '#5C4427'],
    teal: ['#5A8A8C', '#0F2E30'],
    charcoal: ['#4A5568', '#0F1419'],
    copper: ['#D4763E', '#4A1F08'],
  }[d.color] || ['#F2F4F6', '#3A3F46'];
  const path = ({
    shield: 'M85,8 L115,8 L115,22 L155,22 L168,40 L156,52 L156,148 Q156,198 100,228 Q44,198 44,148 L44,52 L32,40 L45,22 L85,22 Z',
    octagon: 'M88,40 L112,40 L120,65 L155,97 L155,143 L123,175 L77,175 L45,143 L45,97 L80,65 L88,40 Z',
    disc: '',
  })[d.shape] || '';
  const isDisc = d.shape === 'disc';
  return `
    <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g${d.id}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${colors[0]}"/>
          <stop offset="100%" stop-color="${colors[1]}"/>
        </linearGradient>
      </defs>
      ${isDisc
        ? `<circle cx="100" cy="130" r="68" fill="url(#g${d.id})" stroke="${colors[1]}" stroke-width="0.9"/>
           <circle cx="100" cy="28" r="12" fill="url(#g${d.id})" stroke="${colors[1]}" stroke-width="0.9"/>
           <circle cx="100" cy="28" r="5" fill="#0A0C10"/>`
        : `<path d="${path}" fill="url(#g${d.id})" stroke="${colors[1]}" stroke-width="0.9"/>
           ${d.shape === 'octagon' ? `<circle cx="100" cy="28" r="12" fill="url(#g${d.id})" stroke="${colors[1]}" stroke-width="0.9"/><circle cx="100" cy="28" r="5" fill="#0A0C10"/>` : ''}`}
      <text x="100" y="${isDisc || d.shape === 'octagon' ? 162 : 160}" text-anchor="middle" font-family="Fraunces, serif" font-size="14" fill="${colors[1]}" letter-spacing="2">${escapeHTML((d.pet_name || '').toUpperCase().slice(0, 12))}</text>
    </svg>
  `;
}

// 点击 design-card 跳到 designer-zh.html?design=<id>（HTML 锚点已设置）
// designer 读取参数并预填 state。
// TODO BACKEND: 把 localStorage 查询替换为 GET /api/me/designs/:id

async function onSignOut() {
  await MarloweAuth.signOut();
  window.location.href = 'index-zh.html';
}
