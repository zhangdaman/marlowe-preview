<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your account — MARLOWE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..500&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #F5F1E8;
  --cream-light: #FBF8F1;
  --paper: #EDE8DA;
  --charcoal: #1F2937;
  --charcoal-soft: #374151;
  --ink: #111827;
  --brass: #B8956A;
  --brass-deep: #8E6F47;
  --brass-light: #D4B896;
  --line: rgba(31, 41, 55, 0.12);
  --line-soft: rgba(31, 41, 55, 0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Manrope', system-ui, sans-serif;
  background: var(--cream);
  color: var(--charcoal);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}
.container { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
@media (max-width: 768px) { .container { padding: 0 20px; } }

.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--brass-deep);
}

/* Nav ============================================================== */
nav.main-nav {
  background: rgba(245, 241, 232, 0.95);
  border-bottom: 1px solid var(--line-soft);
  padding: 22px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.nav-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 40px;
}
.logo {
  font-family: 'Fraunces', serif;
  font-variation-settings: 'opsz' 144;
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0.18em;
  color: var(--ink);
  text-decoration: none;
  text-align: center;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--charcoal-soft);
  text-decoration: none;
}
.back-link:hover { color: var(--charcoal); }
.nav-cta {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 16px;
}
.nav-cta a {
  font-size: 13px;
  color: var(--charcoal-soft);
  text-decoration: none;
}
.nav-cta a:hover { color: var(--brass-deep); }
.signout-btn {
  background: none;
  border: 1px solid var(--line);
  padding: 8px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--charcoal-soft);
  cursor: pointer;
  transition: all 200ms;
}
.signout-btn:hover {
  border-color: var(--charcoal);
  color: var(--charcoal);
}

/* Page layout ===================================================== */
.account-page { padding: 60px 0 120px; }

.account-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 56px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 32px;
  flex-wrap: wrap;
  gap: 24px;
}
.account-header-text .eyebrow { display: inline-block; margin-bottom: 12px; }
.account-header-text h1 {
  font-family: 'Fraunces', serif;
  font-variation-settings: 'opsz' 144;
  font-size: clamp(40px, 5vw, 56px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 8px;
}
.account-header-text h1 em { font-style: italic; color: var(--brass-deep); }
.account-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--charcoal-soft);
  text-align: right;
  line-height: 1.7;
}
.account-meta strong { color: var(--charcoal); font-weight: 500; }
@media (max-width: 600px) {
  .account-meta { text-align: left; }
}

/* Section ========================================================= */
.section {
  margin-bottom: 64px;
}
.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 12px;
}
.section-header h2 {
  font-family: 'Fraunces', serif;
  font-size: 28px;
  font-weight: 500;
  color: var(--ink);
}
.section-header .section-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--brass-deep);
  text-transform: uppercase;
}

/* Empty state ==================================================== */
.empty-card {
  background: var(--cream-light);
  border: 1px solid var(--line);
  padding: 48px 32px;
  text-align: center;
}
.empty-card h3 {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-style: italic;
  color: var(--ink);
  margin-bottom: 8px;
}
.empty-card p {
  font-size: 14px;
  color: var(--charcoal-soft);
  margin-bottom: 24px;
}
.empty-card .btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 24px;
  background: var(--charcoal);
  color: var(--cream);
  border: 1.5px solid var(--charcoal);
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-decoration: none;
  transition: all 200ms;
}
.empty-card .btn-primary:hover { background: var(--cream); color: var(--charcoal); }

/* Order item ===================================================== */
.order-item {
  background: var(--cream-light);
  border: 1px solid var(--line);
  padding: 24px 28px;
  margin-bottom: 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
}
.order-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--charcoal-soft);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.order-meta strong { color: var(--brass-deep); margin-right: 6px; font-weight: 400; }
.order-title {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  color: var(--ink);
  margin-bottom: 4px;
}
.order-status {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 4px 10px;
  border: 1px solid var(--brass);
  color: var(--brass-deep);
  margin-top: 6px;
}
.order-status.delivered { border-color: var(--charcoal-soft); color: var(--charcoal-soft); }
.order-status.shipped { border-color: var(--brass-deep); color: var(--brass-deep); }
.order-status.in_production { border-color: var(--brass); color: var(--brass-deep); }

/* Shipping sub-block (rendered when order.shipping is present) ===== */
.order-shipping {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--charcoal-soft);
  text-transform: uppercase;
}
.order-shipping .label {
  color: var(--brass-deep);
  margin-right: 6px;
}
.order-shipping .tracking-link {
  color: var(--charcoal);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.order-shipping .tracking-link:hover { color: var(--brass-deep); }
.order-shipping .ship-pending {
  grid-column: 1 / -1;
  font-style: italic;
  color: var(--charcoal-soft);
  letter-spacing: 0.06em;
  text-transform: none;
}
@media (max-width: 600px) {
  .order-shipping { grid-template-columns: 1fr; }
}

.order-action {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--charcoal);
  text-decoration: underline;
  text-underline-offset: 4px;
}
.order-action:hover { color: var(--brass-deep); }
@media (max-width: 600px) {
  .order-item { grid-template-columns: 1fr; }
}

/* Design grid (history-of-generations) ============================ */
.design-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.design-card {
  background: var(--cream-light);
  border: 1px solid var(--line);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms;
}
.design-card:hover {
  transform: translateY(-3px);
  border-color: var(--charcoal);
  box-shadow: 0 16px 36px -16px rgba(31, 41, 55, 0.18);
}
.design-thumb {
  width: 100%;
  aspect-ratio: 5 / 6;
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.design-thumb svg { width: 100%; height: 100%; display: block; }
.design-meta {
  font-size: 13px;
  color: var(--charcoal-soft);
  line-height: 1.5;
}
.design-meta strong { color: var(--ink); display: block; font-family: 'Fraunces', serif; font-size: 16px; font-weight: 500; margin-bottom: 4px; }
.design-meta-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--charcoal-soft);
  text-transform: uppercase;
  margin-top: 4px;
}
.design-cta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 12px;
  margin-top: auto;
  border-top: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--charcoal);
}
.design-cta-row .arrow {
  font-family: monospace;
  color: var(--brass-deep);
  transition: transform 200ms;
}
.design-card:hover .design-cta-row .arrow { transform: translateX(4px); }

/* Footer ========================================================== */
.footer-mini {
  text-align: center;
  font-size: 12px;
  color: rgba(31, 41, 55, 0.55);
  padding: 32px 0;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.05em;
  border-top: 1px solid var(--line);
}
.footer-mini a {
  color: var(--charcoal-soft);
  text-decoration: underline;
  text-underline-offset: 3px;
  margin: 0 8px;
}
.footer-mini a:hover { color: var(--charcoal); }
</style>
</head>
<body>

<nav class="main-nav">
  <div class="container nav-grid">
    <a href="index.html" class="back-link">
      <span style="font-family: monospace;">←</span>
      Back to home
    </a>
    <a href="index.html" class="logo">MARLOWE</a>
    <div class="nav-cta">
      <a href="designer.html">Open The Designer</a>
      <button class="signout-btn" onclick="onSignOut()">Sign out</button>
    </div>
  </div>
</nav>

<main class="account-page">
  <div class="container">

    <header class="account-header">
      <div class="account-header-text">
        <div class="eyebrow">§ Your account</div>
        <h1>Welcome back, <em id="display-name">friend.</em></h1>
      </div>
      <div class="account-meta">
        <div><strong>Email</strong> <span id="user-email">—</span></div>
        <div><strong>Sign-in</strong> <span id="user-provider">—</span></div>
        <div><strong>Member since</strong> <span id="user-since">—</span></div>
      </div>
    </header>

    <!-- Orders -->
    <section class="section">
      <div class="section-header">
        <h2>Orders</h2>
        <span class="section-num">§ 01</span>
      </div>
      <div id="orders-container">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Generation history -->
    <section class="section">
      <div class="section-header">
        <h2>Past designs</h2>
        <span class="section-num">§ 02 · Click any to customize again</span>
      </div>
      <div id="designs-container">
        <!-- Populated by JS -->
      </div>
    </section>

  </div>
</main>

<div class="footer-mini">
  <a href="privacy.html">Privacy</a>
  ·
  <a href="terms.html">Terms</a>
  ·
  <a href="contact.html">Contact</a>
</div>

<script src="auth-state.js"></script>
<script src="chat-widget.js" defer></script>
<script>
// Require auth — bounce to login if not signed in
MarloweAuth.requireAuth().then(initAccountPage).catch(() => {});

function initAccountPage(user) {
  // Header
  const handle = (user.displayName || user.email.split('@')[0]) + '.';
  document.getElementById('display-name').textContent = handle;
  document.getElementById('user-email').textContent = user.email;
  const providerLabel = {
    email_otp: 'Email code',
    magic_link: 'Email code',
    apple: 'Apple',
    google: 'Google',
  }[user.provider] || user.provider;
  document.getElementById('user-provider').textContent = providerLabel;
  if (user.signedInAt) {
    const d = new Date(user.signedInAt);
    document.getElementById('user-since').textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Mock data — TODO BACKEND: replace with /api/me/orders + /api/me/designs
  const mockData = readMockData(user);
  renderOrders(mockData.orders);
  renderDesigns(mockData.designs);
}

// MOCK: read from localStorage marlowe_last_order (set by checkout.html)
// Real flow: GET /api/me/orders + GET /api/me/designs
function readMockData(user) {
  let orders = [];
  let designs = [];
  try {
    const last = JSON.parse(localStorage.getItem('marlowe_last_order') || 'null');
    if (last) {
      // Mock status progression based on age — lets us preview the UI
      // for all states (received → in_production → shipped → delivered)
      // without manual fixtures. Real flow: backend sets order.status + shipping.
      const ageMs = Date.now() - new Date(last.placedAt).getTime();
      const ageDays = ageMs / (24 * 60 * 60 * 1000);
      let status = 'in_production';
      let shipping = null;
      if (ageDays >= 16)      status = 'delivered';
      else if (ageDays >= 10) status = 'shipped';
      else                    status = 'in_production';

      if (status === 'shipped' || status === 'delivered') {
        const shippedAt = new Date(new Date(last.placedAt).getTime() + 10 * 24 * 60 * 60 * 1000).toISOString();
        const etaStart  = new Date(new Date(last.placedAt).getTime() + 13 * 24 * 60 * 60 * 1000).toISOString();
        const etaEnd    = new Date(new Date(last.placedAt).getTime() + 16 * 24 * 60 * 60 * 1000).toISOString();
        shipping = {
          carrier: 'USPS Priority',
          tracking_number: '9400 1118 9956 ' + last.orderId.replace(/[^A-Z0-9]/g, '').slice(0, 10),
          tracking_url: 'https://tools.usps.com/go/TrackConfirmAction',
          shipped_at: shippedAt,
          eta_date_start: etaStart,
          eta_date_end: etaEnd,
        };
      }

      orders.push({
        id: last.orderId,
        placed_at: last.placedAt,
        status: status,
        total_cents: (last.payload && last.payload.subtotal || 109) * 100,
        items: (last.payload && last.payload.items) || [],
        shipping: shipping,
      });
      // Promote each ordered tag item to a "saved design".
      // Collars are not designs — they're accessories — so we skip them.
      ((last.payload && last.payload.items) || []).forEach((item, i) => {
        if (item.productType && item.productType !== 'tag') return;
        designs.push({
          id: 'design-' + last.orderId + '-' + i,
          shape: item.shape,
          color: item.color,
          pet_name: item.petName,
          pet_phone: item.petPhone,
          tag_id: item.tagId,
          created_at: last.placedAt,
        });
      });
    }
  } catch (e) {}
  return { orders, designs };
}

function fmtPrice(cents) { return '$' + (cents / 100).toFixed(2); }
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderOrders(orders) {
  const container = document.getElementById('orders-container');
  if (!orders.length) {
    container.innerHTML = `
      <div class="empty-card">
        <h3>No orders yet.</h3>
        <p>Start with a one-of-one portrait — upload a photo, choose a shape and finish, and we'll engrave it.</p>
        <a href="designer.html" class="btn-primary">
          Open The Designer
          <span style="font-family: monospace;">→</span>
        </a>
      </div>
    `;
    return;
  }

  container.innerHTML = orders.map(order => {
    const itemCount = (order.items || []).reduce((n, it) => n + (it.quantity || 1), 0);
    const itemSummary = itemCount + (itemCount === 1 ? ' item' : ' items');
    return `
      <article class="order-item">
        <div>
          <div class="order-meta">
            <span><strong>Order</strong>${escapeHTML(order.id)}</span>
            <span><strong>Placed</strong>${fmtDate(order.placed_at)}</span>
            <span><strong>Total</strong>${fmtPrice(order.total_cents)}</span>
          </div>
          <h3 class="order-title">${itemSummary}</h3>
          <span class="order-status ${escapeHTML(order.status)}">${escapeHTML(formatStatus(order.status))}</span>
          ${renderShipping(order)}
        </div>
        <a href="thank-you.html?order=${encodeURIComponent(order.id)}" class="order-action">View details →</a>
      </article>
    `;
  }).join('');
}

// Shipping sub-block — appears once the order has shipping info on it.
// TODO BACKEND: order.shipping comes from /api/me/orders payload. Schema:
//   shipping: {
//     carrier: 'USPS Priority' | 'UPS Ground' | ...,
//     tracking_number: string,
//     tracking_url: string,             // deep link to carrier site
//     shipped_at: ISO timestamp,
//     eta_date_start: ISO date,         // e.g. 2026-05-18
//     eta_date_end: ISO date,           // e.g. 2026-05-20
//     last_event?: { at, status_text, location }   // optional, for inline status
//   }
function renderShipping(order) {
  const s = order.shipping;
  // No shipping yet — show a single pending line for in-production orders
  if (!s) {
    if (order.status === 'in_production' || order.status === 'received') {
      return `<div class="order-shipping"><span class="ship-pending">Tracking will appear here once your tag ships.</span></div>`;
    }
    return '';
  }
  const trackUrl = s.tracking_url || '#';
  const etaText = (s.eta_date_start && s.eta_date_end)
    ? fmtShortDate(s.eta_date_start) + '–' + fmtShortDate(s.eta_date_end)
    : (s.eta_date_start ? fmtShortDate(s.eta_date_start) : '—');
  return `
    <div class="order-shipping">
      <span><span class="label">Carrier</span>${escapeHTML(s.carrier || '—')}</span>
      <span><span class="label">ETA</span>${etaText}</span>
      <span style="grid-column: 1 / -1;">
        <span class="label">Tracking</span>
        <a class="tracking-link" href="${escapeHTML(trackUrl)}" target="_blank" rel="noopener">${escapeHTML(s.tracking_number || '—')} →</a>
      </span>
    </div>
  `;
}

function fmtShortDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatStatus(status) {
  return ({
    received: 'Received',
    in_production: 'In production',
    shipped: 'Shipped',
    delivered: 'Delivered',
    cancelled: 'Cancelled',
  })[status] || status;
}

const SHAPE_NAMES = { shield: 'The Shield Tag', octagon: 'The Octagon Tag', disc: 'The Disc Tag' };
const COLOR_NAMES = {
  silver: 'Titanium Silver', brass: 'Champagne Gold', teal: 'Sky Blue',
  charcoal: 'Storm Black', copper: 'Rose Copper',
};

function renderDesigns(designs) {
  const container = document.getElementById('designs-container');
  if (!designs.length) {
    container.innerHTML = `
      <div class="empty-card">
        <h3>Nothing saved yet.</h3>
        <p>Every portrait you generate is archived here. Come back to customize the same design on a different finish, add engraving updates, or order a backup — without re-uploading the photo.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = '<div class="design-grid">' + designs.map(d => `
    <a class="design-card" href="designer.html?design=${encodeURIComponent(d.id)}">
      <div class="design-thumb">${miniSVG(d)}</div>
      <div class="design-meta">
        <strong>${escapeHTML(SHAPE_NAMES[d.shape] || d.shape)}</strong>
        ${escapeHTML(COLOR_NAMES[d.color] || d.color)}<br>
        ${escapeHTML(d.pet_name)} · ${escapeHTML(d.pet_phone)}
        <div class="design-meta-line">§ #${escapeHTML(d.tag_id || d.id.slice(-8))} · saved ${fmtDate(d.created_at)}</div>
      </div>
      <div class="design-cta-row">
        <span>Customize again</span>
        <span class="arrow">→</span>
      </div>
    </a>
  `).join('') + '</div>';
}

// Tiny placeholder SVG for design thumbnails (real impl would use halftone_url or rebuilt SVG)
function miniSVG(d) {
  const colors = {
    silver: ['#F2F4F6', '#3A3F46'],
    brass: ['#E8D4AB', '#5C4427'],
    teal: ['#5A8A8C', '#0F2E30'],
    charcoal: ['#4A5568', '#0F1419'],
    copper: ['#D4763E', '#4A1F08'],
  }[d.color] || ['#F2F4F6', '#3A3F46'];
  const path = ({
    shield: 'M85,8 L115,8 L115,22 L155,22 L168,40 L156,52 L156,148 Q156,198 100,228 Q44,198 44,148 L44,52 L32,40 L45,22 L85,22 Z',
    octagon: 'M88,40 L112,40 L120,65 L155,97 L155,143 L123,175 L77,175 L45,143 L45,97 L80,65 L88,40 Z',
    disc: '',
  })[d.shape] || '';
  const isDisc = d.shape === 'disc';
  return `
    <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g${d.id}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${colors[0]}"/>
          <stop offset="100%" stop-color="${colors[1]}"/>
        </linearGradient>
      </defs>
      ${isDisc
        ? `<circle cx="100" cy="130" r="68" fill="url(#g${d.id})" stroke="${colors[1]}" stroke-width="0.9"/>
           <circle cx="100" cy="28" r="12" fill="url(#g${d.id})" stroke="${colors[1]}" stroke-width="0.9"/>
           <circle cx="100" cy="28" r="5" fill="#0A0C10"/>`
        : `<path d="${path}" fill="url(#g${d.id})" stroke="${colors[1]}" stroke-width="0.9"/>
           ${d.shape === 'octagon' ? `<circle cx="100" cy="28" r="12" fill="url(#g${d.id})" stroke="${colors[1]}" stroke-width="0.9"/><circle cx="100" cy="28" r="5" fill="#0A0C10"/>` : ''}`}
      <text x="100" y="${isDisc || d.shape === 'octagon' ? 162 : 160}" text-anchor="middle" font-family="Fraunces, serif" font-size="14" fill="${colors[1]}" letter-spacing="2">${escapeHTML((d.pet_name || '').toUpperCase().slice(0, 12))}</text>
    </svg>
  `;
}

// Card click navigates to designer.html?design=<id> (see anchor in renderDesigns).
// Designer reads the param and pre-populates state from this saved design.
// TODO BACKEND: replace localStorage lookup with GET /api/me/designs/:id.

async function onSignOut() {
  await MarloweAuth.signOut();
  window.location.href = 'index.html';
}
</script>
